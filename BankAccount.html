<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Account Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .balance {
            background: #f3f4ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 5px;
            color: #4f46e5;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 45%;
            padding: 12px;
            margin: 8px 2%;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏦 Bank Account</h1>
    <p class="subtitle">Bank Account Management System</p>

    <div class="balance">
        <p>Current Balance</p>
        <h2>₹ <span id="balance">0</span></h2>
    </div>

    <input type="number" id="amount" placeholder="Enter amount">

    <div>
        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>
    </div>

    <button onclick="checkBalance()">Check Balance</button>

    <p id="message"></p>
    <div class="history">
        <h2>Transaction History</h2>
        <ul id="transactionList"></ul>
    </div>

</div>

<script>

    let balance = Number(localStorage.getItem("balance")) || 500;
    let transactions = [];
    
    let savedTransactions = JSON.parse(localStorage.getItem("transactions")) || [];
transactions = savedTransactions;

    function deposit() {

        let amount = Number(document.getElementById("amount").value);

        if (amount <= 0) {
            showMessage("Please enter a valid amount.");
            return;
        }

        balance += amount;
        transactions.push("Deposit: ₹" + amount);
        localStorage.setItem("transactions", JSON.stringify(transactions));
        localStorage.setItem("balance", balance);

        updateBalance();

        showMessage("₹" + amount + " deposited successfully!");
    }

    function withdraw() {

        let amount = Number(document.getElementById("amount").value);

        if (amount <= 0) {
            showMessage("Please enter a valid amount.");
            return;
        }

        if (amount > balance) {
            showMessage("Insufficient balance!");
            return;
        }

        balance -= amount;
        transactions.push("Withdraw: ₹" + amount);
        localStorage.setItem("transactions", JSON.stringify(transactions));
        localStorage.setItem("balance", balance);

        updateBalance();

        showMessage("₹" + amount + " withdrawn successfully!");
    }

    function checkBalance() {

        showMessage("Current Balance: ₹" + balance);
    }

    function updateBalance() {

        document.getElementById("balance").innerText = balance;

        document.getElementById("amount").value = "";
        let list = document.getElementById("transactionList");
list.innerHTML = "";

transactions.forEach(function(transaction) {
    let li = document.createElement("li");
    li.innerText = transaction;
    list.appendChild(li);
});
    }

    function showMessage(message) {

        document.getElementById("message").innerText = message;
    }
    updateBalance();

</script>

</body>
</html>
